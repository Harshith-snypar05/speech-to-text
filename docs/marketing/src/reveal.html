<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScriptLiv logo reveal (deterministic, frame(t))</title>
<style>
@font-face {
  font-family: 'Inter';
  src: url('../../../scriptliv_web/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
  font-weight: 100 900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; font-family: 'Inter', sans-serif; }
#stage {
  position: relative; width: 1080px; height: 1350px; overflow: hidden;
  background: linear-gradient(180deg, #1B0B33 0%, #2B0F52 100%); color: #F8F7FF;
}
#glow {
  position: absolute; left: 140px; top: 360px; width: 800px; height: 800px; border-radius: 50%;
  background: rgba(106,0,255,.6); filter: blur(130px); opacity: .5;
}
#bars { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
#bars i { position: absolute; width: 24px; border-radius: 12px; background: #A855F7; will-change: transform; }
#flash { position: absolute; left: 440px; top: 575px; width: 200px; height: 200px; border-radius: 50%; background: #E9D5FF; filter: blur(30px); opacity: 0; }
#logo { position: absolute; left: 140px; top: 540px; width: 800px; opacity: 0; transform-origin: 50% 50%; }
#logo img { display: block; width: 800px; }
#tag { position: absolute; left: 0; right: 0; top: 780px; text-align: center; font-size: 54px; font-weight: 500; color: #E9D5FF; letter-spacing: -.5px; height: 70px; }
#tag span.c { display: inline-block; width: 6px; height: 52px; background: #A855F7; border-radius: 3px; margin-left: 8px; vertical-align: -8px; }
#cta { position: absolute; left: 0; right: 0; top: 1020px; text-align: center; opacity: 0; }
#cta .url { font-size: 64px; font-weight: 700; letter-spacing: -1px; color: #F8F7FF; }
#cta .url em { font-style: normal; color: #A855F7; }
#cta .sub { margin-top: 22px; font-size: 38px; font-weight: 400; color: #E9D5FF; opacity: .9; }
#kicker { position: absolute; left: 90px; top: 110px; font-size: 34px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: #E9D5FF; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="kicker">Something is being built</div>
  <div id="bars"></div>
  <div id="flash"></div>
  <div id="logo"><img id="logoimg" src="../../../assets/branding/exports/horizontal-dark-1600.png" alt="ScriptLiv"></div>
  <div id="tag"></div>
  <div id="cta">
    <div class="url">script<em>liv</em>.com</div>
    <div class="sub">Try it free on the web. Android app coming soon.</div>
  </div>
</div>
<script>
const N = 25, W = 24, GAP = 14, CY = 675;
const bars = document.getElementById('bars');
const els = [];
for (let k = 0; k < N; k++) {
  const b = document.createElement('i');
  const x = 540 - (N * W + (N - 1) * GAP) / 2 + k * (W + GAP);
  b.dataset.x = x; b.style.left = x + 'px';
  bars.appendChild(b); els.push(b);
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const rnd = (i) => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };
const TAG = 'Live speech to text.';

function frame(t) {
  const $ = (id) => document.getElementById(id);
  // kicker: 0.2-0.8 in, out by 2.8
  $('kicker').style.opacity = clamp((t - .2) / .6) * (1 - clamp((t - 2.5) / .5)) * .9;
  // bars: amplitude ramps 0.3 -> 1 until 3.0, then converge 3.0-3.6
  const amp = .3 + .7 * easeInOut(t / 3.0);
  const conv = easeInOut((t - 3.0) / .6);
  els.forEach((b, k) => {
    const mid = (N - 1) / 2, d = Math.abs(k - mid) / mid;
    const env = 1 - .75 * d * d;
    const wob = .55 + .45 * Math.sin(t * (5 + rnd(k) * 5) + k * 1.7);
    let h = (60 + 520 * env * wob * amp) * (1 - conv);
    h = Math.max(h, 0);
    const x0 = +b.dataset.x, tx = (540 - 12 - x0) * conv;
    b.style.height = h + 'px';
    b.style.top = (CY - h / 2) + 'px';
    b.style.transform = `translateX(${tx}px)`;
    b.style.opacity = (1 - conv * .0) * (t < .01 ? 0 : 1) * (t < 3.6 ? 1 : 0) * (.35 + .65 * easeOut(t / 1.0));
  });
  // flash at 3.45-4.0
  const f = clamp((t - 3.45) / .12) * (1 - clamp((t - 3.57) / .5));
  $('flash').style.opacity = f;
  $('flash').style.transform = `scale(${1 + 1.5 * clamp((t - 3.45) / .6)})`;
  // logo in 3.5-4.5: wipe + scale + deblur
  const lp = easeOut((t - 3.5) / 1.0);
  const logo = $('logo');
  logo.style.opacity = clamp((t - 3.5) / .3);
  logo.style.transform = `scale(${.86 + .14 * lp})`;
  logo.style.filter = `blur(${(1 - lp) * 18}px)`;
  logo.style.clipPath = `inset(0 ${(1 - clamp((t - 3.5) / .9)) * 100}% 0 0)`;
  // tagline typing 4.7-5.9
  const n = Math.floor(clamp((t - 4.7) / 1.2) * TAG.length);
  const blink = (Math.floor(t * 2) % 2 === 0 || t < 5.9) ? 1 : 0;
  $('tag').innerHTML = (t < 4.7 ? '' : TAG.slice(0, n)) + (t >= 4.7 && blink ? '<span class="c"></span>' : '');
  // cta 6.3-7.0
  const c = clamp((t - 6.3) / .7);
  $('cta').style.opacity = c;
  $('cta').style.transform = `translateY(${(1 - easeOut(c)) * 30}px)`;
  // glow pulse
  $('glow').style.opacity = .35 + .25 * clamp(t / 3.4) + .2 * f;
}
frame(0);
</script>
</body>
</html>
