<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScriptLiv teasers (LinkedIn 1080x1350)</title>
<style>
@font-face {
  font-family: 'Inter';
  src: url('../../../scriptliv_web/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
  font-weight: 100 900;
}
:root {
  --primary: #6A00FF; --secondary: #A855F7; --accent: #E9D5FF; --bg: #F8F7FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; font-family: 'Inter', sans-serif; }
.slide {
  position: relative; width: 1080px; height: 1350px; overflow: hidden;
  background: linear-gradient(180deg, #1B0B33 0%, #2B0F52 100%);
  color: var(--bg);
}
.glow {
  position: absolute; left: -10px; top: 560px; width: 1100px; height: 1100px; border-radius: 50%;
  background: rgba(106, 0, 255, .55); filter: blur(130px);
}
.wave { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 22px; }
.wave i { display: block; width: 26px; border-radius: 13px; background: var(--secondary); }
.copy { position: absolute; left: 90px; right: 90px; }
h1 { font-size: 112px; line-height: 1.04; font-weight: 800; letter-spacing: -3px; }
h1 em { font-style: normal; color: var(--secondary); }
p.sub { margin-top: 36px; font-size: 44px; line-height: 1.35; font-weight: 400; color: var(--accent); opacity: .92; }
.tag {
  position: absolute; left: 90px; bottom: 90px; display: flex; align-items: center; gap: 18px;
  font-size: 34px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: var(--accent);
}
.tag b { width: 18px; height: 18px; border-radius: 50%; background: var(--secondary); box-shadow: 0 0 24px 6px rgba(168,85,247,.8); }
.page { position: absolute; right: 90px; bottom: 90px; font-size: 30px; font-weight: 500; color: var(--accent); opacity: .6; }

/* slide 2: text lines forming as if typed */
.lines { position: absolute; left: 90px; right: 90px; top: 750px; display: flex; flex-direction: column; gap: 34px; }
.lines span { display: block; height: 34px; border-radius: 17px; background: rgba(233,213,255,.16); }
.lines span.hot { background: var(--secondary); }
.cursor { display: inline-block; width: 8px; height: 34px; background: var(--secondary); border-radius: 4px; margin-left: 10px; vertical-align: middle; }
.pill {
  position: absolute; left: 90px; top: 600px; padding: 14px 30px; border-radius: 100px;
  background: rgba(168,85,247,.18); border: 2px solid rgba(168,85,247,.5);
  font-size: 30px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: var(--accent);
}
</style>
</head>
<body>

<!-- 1 -->
<section class="slide" id="t1">
  <div class="glow"></div>
  <div class="wave" id="w1" style="top:640px;height:520px"></div>
  <div class="copy" style="top:150px">
    <h1>Something is <em>being built.</em></h1>
    <p class="sub">A new way to turn your voice into words.</p>
  </div>
  <div class="tag"><b></b>Coming soon</div>
  <div class="page">1 / 3</div>
</section>

<!-- 2 -->
<section class="slide" id="t2">
  <div class="glow" style="top:640px"></div>
  <div class="copy" style="top:150px">
    <h1>What if words <em>appeared</em> as you spoke?</h1>
  </div>
  <div class="pill">Listening</div>
  <div class="lines">
    <span style="width:92%"></span>
    <span style="width:76%"></span>
    <span class="hot" style="width:58%"></span>
    <span style="width:30%;height:34px"></span>
  </div>
  <div class="wave" id="w2" style="top:1010px;height:190px"></div>
  <div class="tag"><b></b>Coming soon</div>
  <div class="page">2 / 3</div>
</section>

<!-- 3 -->
<section class="slide" id="t3">
  <div class="glow"></div>
  <div class="wave" id="w3" style="top:600px;height:560px"></div>
  <div class="copy" style="top:150px">
    <h1>Built to follow <em>real accents.</em></h1>
    <p class="sub">Because nobody speaks like a textbook.</p>
  </div>
  <div class="tag"><b></b>Coming soon</div>
  <div class="page">3 / 3</div>
</section>

<script>
function bars(id, hs, op) {
  const el = document.getElementById(id);
  hs.forEach(h => { const b = document.createElement('i'); b.style.height = h + 'px'; b.style.opacity = op; el.appendChild(b); });
}
bars('w1', [60,110,180,270,360,440,360,270,330,440,520,440,330,230,150,100,60], .28);
bars('w2', [40,70,110,70,150,70,110,70,40,90,140,90,40], .85);
bars('w3', [80,140,220,320,230,400,520,380,260,440,330,200,300,180,110,70,50], .28);
</script>
</body>
</html>
