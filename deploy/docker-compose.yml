# ScriptLiv production stack: API + relay + web + Caddy (HTTPS). Provider-agnostic -- any Linux VM
# (Oracle/DigitalOcean/AWS/etc.) with Docker and ports 80/443 open works the same way:
#   cp deploy/production.env.example deploy/production.env   # fill in
#   mkdir -p deploy/models && cp /path/to/ggml-parakeet-tdt-0.6b-v2-q8_0.bin deploy/models/   # ~669MB, not in git
#   docker compose -f deploy/docker-compose.yml --env-file deploy/production.env up -d --build
services:
  api:
    build: ../scriptliv_api
    env_file: production.env
    environment:
      SCRIPTLIV_TRUST_PROXY: "1"
    restart: unless-stopped
    expose:
      - "8790"   # internal only (relay + web reach it by service name); never published to the host

  relay:
    build:
      context: ..
      dockerfile: relays_phase7c/Dockerfile
    env_file: production.env
    environment:
      SCRIPTLIV_API_URL: http://api:8790
    volumes:
      - ./models:/srv/whisper.cpp/models:ro
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "8772"

  web:
    build:
      context: ../scriptliv_web
      args:
        NEXT_PUBLIC_SL_API_BASE: /sl
        SL_BACKEND_HTTP: http://api:8790
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: production.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
      - relay
    restart: unless-stopped

volumes:
  caddy_data:
